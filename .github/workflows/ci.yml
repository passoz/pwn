name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (build, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
      - name: go test
        run: CGO_ENABLED=1 go test -race ./... -coverpkg=./... -coverprofile=coverage.out
      - name: coverage gate
        run: go tool cover -func=coverage.out | awk '/^total:/{if ($3+0 < 85.0) exit 1}'
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o bin/pwn ./cmd/pwn
      - name: self-check
        run: ./bin/pwn self-check
      - name: validate
        run: ./bin/pwn validate
